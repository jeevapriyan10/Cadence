name: CI

on:
  push:
    branches:
      - main
      - "M*"
      - "module-*"
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check cadence/ tests/

      - name: Run pytest with coverage
        run: |
          pytest --cov-fail-under=90

  frontend:
    name: Frontend CI (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint frontend
        run: |
          npm run lint

      - name: Type check
        run: |
          npx tsc --noEmit

      - name: Run tests
        run: |
          npm test

      - name: Build frontend
        run: |
          npm run build

  docker-build-smoke-test:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker containers
        run: |
          docker compose build

      - name: Start services
        run: |
          docker compose up -d

      - name: Wait for backend health check
        run: |
          timeout=60
          start_time=$(date +%s)
          echo "Waiting for backend service to become healthy at http://localhost:8000/health..."
          until curl -s -f http://localhost:8000/health > /dev/null; do
            elapsed=$(( $(date +%s) - start_time ))
            if [ $elapsed -ge $timeout ]; then
              echo "Healthcheck timed out after ${timeout} seconds."
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          echo "Backend service is responsive after $(( $(date +%s) - start_time )) seconds."

      - name: Verify GET /health endpoint
        run: |
          http_code=$(curl -s -o /tmp/health_response.json -w "%{http_code}" http://localhost:8000/health)
          echo "HTTP response status code: $http_code"
          cat /tmp/health_response.json
          echo ""
          if [ "$http_code" -ne 200 ]; then
            echo "Expected HTTP 200 from /health, got $http_code"
            docker compose logs
            exit 1
          fi

      - name: Cleanup Docker containers
        if: always()
        run: |
          docker compose down -v
