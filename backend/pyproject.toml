[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cadence"
version = "0.1.0"
description = "Cadence railway block-window scheduling engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "jeevapriyan10" }
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "sqlalchemy",
    "alembic",
    "ortools",
    "networkx",
    "gymnasium",
    "psycopg2-binary",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cadence*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
pythonpath = ["."]
addopts = "--cov=cadence --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E9",      # Syntax and structural errors
    "F",       # Pyflakes (runtime errors, undefined names)
]
ignore = [
    "E501",    # Line length (style nitpick)
    "F401",    # Unused import (style nitpick)
    "F811",    # Redefinition of unused name
    "F841",    # Local variable assigned but unused
]

